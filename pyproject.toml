[project]
name = "pyhydrophone"
version = "0.4.0"
description = "python package to read and calibrate hydrophone data"
authors = [{ name = "Clea Parcerisas", email = "clea.parcerisas@vliz.be" }]
requires-python = ">=3.10, <=3.14.0"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=2.0.2,<3",
    "requests>=2.33.0,<3",
    "soundfile>=0.12.1,<0.13",
    "openpyxl>=3.1.2,<4",
    "scipy==1.13.1",
    "matplotlib>=3.9.4,<4",
    "pillow>=12.2.0,<13",
    "urllib3>=2.7.0,<3",
    "mistune>=3.2.1,<4",
]

[dependency-groups]
test = [
    "pyyaml>=6.0,<7",
    "pytest>=9.0.3,<10",
    "coverage>=7.2.5,<8",
    "python-dotenv>=1.2.2,<2",
    "pytest-cov>=4.1.0,<5",
]
docs = [
    "sphinx>=7.2.6 ; python_full_version >= '3.11'",
    "sphinx-rtd-theme>=1.3.0",
    "m2r>=0.2",
    "docutils>=0.20",
    "sphinx-copybutton>=0.5.2",
    "ipykernel>=6.29.5,<7",
    "sphinx-gallery>=0.19.0,<0.20",
    "pillow>=12.2.0,<13",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.1,<0.11.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
testpaths = ["tests",]
pythonpath = ["."]
