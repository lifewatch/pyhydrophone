# Required
version: 2
formats: []

# Build documentation in the docs/ directory with Sphinx
sphinx:
   configuration: docs/source/conf.py

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - libsndfile1-dev

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs